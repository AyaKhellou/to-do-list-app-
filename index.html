<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>
        <!-- Font Awesome CDN -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <!-- main css file -->
        <link rel="stylesheet" href="main.css">
        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Indie+Flower&display=swap" rel="stylesheet">
        <!-- sweetalert -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <div class="title">
            <h2>
                <img src="./assets/liste-de-choses-a-faire.png" >
                My To-Do List
            </h2>
        </div>
        <div class="quote">
            <img src="./assets/left-quote-sketch.png" alt="">
            <p></p>
            <img src="./assets/right-quote-sketch.png" alt="">
        </div>
        <div class="toDo">
            <form class="addTask">
                <input type="text" name="task" id="task" placeholder="Add task" autofocus>
                <button>
                    <i class="fa-solid fa-plus" title="plus mark"></i>
                </button>
            </form>
            <section class="tasks-container">
                <div class="section-header">
                    <h3>Tasks</h3>
                    <div class="filters">
                        <div class="filter all">all</div>
                        <div class="filter pending">pending</div>
                        <div class="filter done">done</div>
                    </div>
                </div>
                <div class="tasks"></div>
            </section>
        </div>
    </div>
    <script src="/dist/main.js"></script>
</body>
</html>
